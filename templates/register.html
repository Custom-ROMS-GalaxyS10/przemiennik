<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Przemienniki WM — Rejestracja</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="auth-container">
    <div class="auth-box">
        <h1>📡 Rejestracja</h1>
        <p>Utwórz konto radioamatorskie</p>

        <form method="POST">
            <label>ZNAK</label>
            <input type="text" name="znak" placeholder="SPXXXX" required>

            <label>HASŁO</label>
            <input type="password" name="haslo" required>

            <label>POWTÓRZ HASŁO</label>
            <input type="password" name="haslo2" required>

            <button type="submit">ZAREJESTRUJ</button>
        </form>

        <div class="auth-links">
            <a href="{{ url_for('login') }}">Masz już konto? Zaloguj się</a>
        </div>
    </div>
</div>

</body>
</html>
