<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel administratora</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header>
    <div class="logo">📡 Panel administratora</div>

    <nav>
        <a href="{{ url_for('index') }}">Start</a>
        <a href="{{ url_for('przemienniki') }}">Przemienniki</a>
        <a href="{{ url_for('profil') }}">Profil</a>
        <a href="{{ url_for('logout') }}">Wyloguj</a>
    </nav>
</header>

<main class="container">

    <h1>Panel administratora</h1>

    <section class="admin-grid">

        <div class="admin-card">
            <h2>📡 Przemienniki</h2>
            <p>Zarządzaj listą przemienników.</p>

            <a href="{{ url_for('admin_przemienniki') }}" class="admin-button">
                ZARZĄDZAJ
            </a>
        </div>

        <div class="admin-card">
            <h2>👥 Użytkownicy</h2>
            <p>Zarządzaj zarejestrowanymi znakami.</p>

            <a href="{{ url_for('admin_uzytkownicy') }}" class="admin-button">
                ZARZĄDZAJ
            </a>
        </div>

        <div class="admin-card">
            <h2>⚠️ Zgłoszenia</h2>
            <p>Sprawdź zgłoszenia dotyczące przemienników.</p>

            <a href="{{ url_for('admin_zgloszenia') }}" class="admin-button">
                ZOBACZ
            </a>
        </div>

    </section>

</main>

</body>
</html>
